AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Disposable demo: ALB post-quantum TLS policies. One internal ALB with three HTTPS listeners
  (PQ security policy on 443, classical policy on 8443), connection logs to S3, and a test
  client instance (SSM only, no inbound ports) with OpenSSL 3.5+.

Parameters:
  CertificateArn:
    Type: String
    Default: ''
    Description: >-
      Optional. ARN of your own ACM certificate in this Region. Leave empty (default) and the stack generates and
      imports a self-signed certificate for the demo, and deletes it with the stack.
    AllowedPattern: '^(arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-zA-Z0-9-]+)?$'
  PqSecurityPolicy:
    Type: String
    Default: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
    Description: Security policy of the PQ listener (port 443). Must contain PQ in its name.
  ClassicSecurityPolicy:
    Type: String
    Default: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    Description: Security policy of the control listener (port 8443). Classical, no ML-KEM.
  Tls13OnlySecurityPolicy:
    Type: String
    Default: ELBSecurityPolicy-TLS13-1-3-PQ-2025-09
    Description: Security policy of the TLS 1.3 only PQ listener (port 9443).
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large]
  LogPrefix:
    Type: String
    Default: alb-conn
    AllowedPattern: '^[a-zA-Z0-9-]{1,40}$'
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  GenerateCertificate: !Equals [!Ref CertificateArn, '']

Resources:
  # ---------------------------------------------------------------- self-signed certificate (custom resource)
  CertFunctionRole:
    Type: AWS::IAM::Role
    Condition: GenerateCertificate
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: acm-import-delete
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ImportAndTag     # no resource exists yet at import time
                Effect: Allow
                Action: [acm:ImportCertificate, acm:AddTagsToCertificate]
                Resource: '*'
              - Sid: DeleteOwnCertificates
                Effect: Allow
                Action: acm:DeleteCertificate
                Resource: !Sub 'arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*'
  CertFunction:
    Type: AWS::Lambda::Function
    Condition: GenerateCertificate
    Properties:
      Description: Generates a self-signed RSA-2048 certificate and imports it into ACM (demo only)
      Runtime: python3.12
      Handler: index.handler
      Timeout: 180
      MemorySize: 1024
      Role: !GetAtt CertFunctionRole.Arn
      Code:
        ZipFile: |
          import base64, zlib
          exec(zlib.decompress(base64.b64decode('')).decode())
  GeneratedCertificate:
    Type: Custom::SelfSignedCertificate
    Condition: GenerateCertificate
    Properties:
      ServiceToken: !GetAtt CertFunction.Arn
      CommonName: pq-demo.example.internal
      ValidityDays: 7

  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.77.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: pq-alb-demo}]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw}
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.77.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: pq-alb-demo-a}]
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.77.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: pq-alb-demo-b}]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: {RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw}
  RtaA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable}
  RtaB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable}

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB, reachable from the test client only
      VpcId: !Ref Vpc
  ClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Test client, no inbound, outbound 443 and 8443 only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 8443, ToPort: 9443, CidrIp: 10.77.0.0/16}
  AlbIngress443:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref ClientSecurityGroup}
  AlbIngress8443:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: 8443, ToPort: 8443, SourceSecurityGroupId: !Ref ClientSecurityGroup}

  AlbIngress9443:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: 9443, ToPort: 9443, SourceSecurityGroupId: !Ref ClientSecurityGroup}

  # ---------------------------------------------------------------- connection logs bucket
  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketEncryption:   # connection logs only support SSE-S3
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules: [{Id: expire-demo-logs, Status: Enabled, ExpirationInDays: 3}]
  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowElbConnectionLogs
            Effect: Allow
            Principal: {Service: logdelivery.elasticloadbalancing.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${LogBucket}/${LogPrefix}/AWSLogs/${AWS::AccountId}/*'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${LogBucket}'
              - !Sub 'arn:${AWS::Partition}:s3:::${LogBucket}/*'
            Condition: {Bool: {'aws:SecureTransport': 'false'}}

  # ---------------------------------------------------------------- load balancer
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: [LogBucketPolicy, DefaultRoute]
    Properties:
      Type: application
      Scheme: internal
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: connection_logs.s3.enabled, Value: 'true'}
        - {Key: connection_logs.s3.bucket, Value: !Ref LogBucket}
        - {Key: connection_logs.s3.prefix, Value: !Ref LogPrefix}
  PqListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: !Ref PqSecurityPolicy
      Certificates: [{CertificateArn: !If [GenerateCertificate, !GetAtt GeneratedCertificate.CertificateArn, !Ref CertificateArn]}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '200', ContentType: text/plain, MessageBody: 'PQ listener (port 443)'}
  ClassicListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 8443
      Protocol: HTTPS
      SslPolicy: !Ref ClassicSecurityPolicy
      Certificates: [{CertificateArn: !If [GenerateCertificate, !GetAtt GeneratedCertificate.CertificateArn, !Ref CertificateArn]}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '200', ContentType: text/plain, MessageBody: 'Classical listener (port 8443)'}

  Tls13Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 9443
      Protocol: HTTPS
      SslPolicy: !Ref Tls13OnlySecurityPolicy
      Certificates: [{CertificateArn: !If [GenerateCertificate, !GetAtt GeneratedCertificate.CertificateArn, !Ref CertificateArn]}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '200', ContentType: text/plain, MessageBody: 'TLS 1.3 only PQ listener (port 9443)'}

  # ---------------------------------------------------------------- test client
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: pq-alb-demo-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadElbConfig
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:DescribeSSLPolicies
                Resource: '*'
              - Sid: ReadConnectionLogs
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt LogBucket.Arn
              - Sid: ReadConnectionLogObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${LogBucket.Arn}/*'
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref InstanceRole]}
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 2, HttpEndpoint: enabled}
  DemoInstance:
    Type: AWS::EC2::Instance
    DependsOn: [PqListener, ClassicListener, Tls13Listener]
    CreationPolicy:
      ResourceSignal: {Count: 1, Timeout: PT25M}
    Metadata:
      AWS::CloudFormation::Init:
        config:
          files:
            /opt/pq-alb-demo/demo.env:
              mode: '000644'
              owner: root
              group: root
              content: !Sub |
                ALB_DNS=${Alb.DNSName}
                ALB_ARN=${Alb}
                AWS_REGION=${AWS::Region}
                AWS_DEFAULT_REGION=${AWS::Region}
                LOG_BUCKET=${LogBucket}
                LOG_PREFIX=${LogPrefix}
                PQ_PORT=443
                CLASSIC_PORT=8443
                TLS13_PORT=9443
                SNI_NAME=pq-demo.example.internal
            /opt/pq-alb-demo/scripts.tgz.b64:
              mode: '000600'
              owner: root
              group: root
